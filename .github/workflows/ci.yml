name: CI

# Every push and pull request is tested on Linux, Windows and macOS. The Windows
# installer is slow to build, so it runs only for release tags (v*) or on demand
# (Actions tab > CI > Run workflow).
on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Also test on Windows and macOS and build the Windows installer"
        type: boolean
        default: true

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ubuntu-latest · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project + dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check aegis tests evaluation packaging

      - name: Type check (mypy)
        # numpy ships 3.12-only stub syntax, so the type check runs on the
        # newest supported Python; the tests still run on every version.
        if: matrix.python-version == '3.13'
        run: mypy

      - name: Run tests
        # Keep test state out of the real user profile on every runner.
        env:
          AEGIS_DATA_DIR: ${{ runner.temp }}/aegis-data
        run: pytest --cov=aegis --cov-report=term-missing

  test-desktop:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    # Aegis claims to run on all three desktop platforms; this job keeps that
    # claim verifiable on every push.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project + dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        env:
          AEGIS_DATA_DIR: ${{ runner.temp }}/aegis-data
        run: pytest

  windows-installer:
    name: Windows installer
    needs: [test, test-desktop]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build app and installer
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: aegis-windows-installer
          path: dist/installer/*.exe

  package:
    name: Build & verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Verify package metadata
        # Catches malformed metadata before it reaches PyPI, where a bad
        # release cannot be replaced — only yanked.
        run: twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

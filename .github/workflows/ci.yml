name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Aegis claims to run on all three desktop platforms; the matrix is what
        # makes that claim verifiable rather than aspirational. The full Python
        # range is exercised on Linux, with the edges covered elsewhere to keep
        # the matrix affordable.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          - { os: windows-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.12" }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project + dev tooling
        # Install the package with its real dependencies (psutil, scikit-learn,
        # numpy, win11toast, flet…) so the test suite can import every module,
        # plus the dev tools. Installing the package also validates the metadata.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check aegis tests evaluation

      - name: Run tests
        # Keep test state out of the real user profile on every runner.
        env:
          AEGIS_DATA_DIR: ${{ runner.temp }}/aegis-data
        run: pytest --cov=aegis --cov-report=term-missing

  windows-installer:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build app and installer
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: aegis-windows-installer
          path: dist/installer/*.exe

  package:
    name: Build & verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Verify package metadata
        # Catches malformed metadata before it reaches PyPI, where a bad
        # release cannot be replaced — only yanked.
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

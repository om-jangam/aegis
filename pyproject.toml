[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-hids"
dynamic = ["version"]
description = "Aegis — Cross-platform host security monitoring, detection & response"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Om Jangam" }]
keywords = ["security", "host-ids", "hids", "firewall", "detection-engineering", "mitre-attack", "blue-team", "nftables", "pf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
# The base install is headless so it can go on a server without dragging in a
# GUI toolkit. The desktop console is the `ui` extra.
dependencies = [
    "psutil>=7.0,<8",
    "win11toast>=0.35; sys_platform == 'win32'",
    "scikit-learn>=1.5,<2",
    "numpy>=2.0,<3",
    "joblib>=1.3",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/om-jangam/aegis"
Repository = "https://github.com/om-jangam/aegis"
Issues = "https://github.com/om-jangam/aegis/issues"

[project.optional-dependencies]
ui = ["flet>=0.86,<1.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "flet>=0.86,<1.1",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.mypy]
# 3.12 because numpy's bundled stubs use 3.12 syntax that mypy cannot parse
# under an older target. Ruff still holds the code to the 3.11 this project
# supports, and CI runs the tests on 3.11.
python_version = "3.12"
files = ["aegis"]
# Type checking is here to catch real mistakes (an unhandled None, a wrong
# argument), not to force annotations on to every helper, so untyped function
# bodies stay unchecked and third-party packages that ship no type information
# are taken at their word.
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["psutil.*", "yaml.*", "win11toast.*", "sklearn.*", "joblib.*"]
ignore_missing_imports = true


[tool.setuptools.packages.find]
include = ["aegis*"]
exclude = ["reference_scaffold*", "tests*"]

[tool.setuptools.package-data]
# The bundled Sigma rules are data, not code, so they must be declared to reach
# the wheel — otherwise an installed Aegis would load zero rules.
"aegis.detection.sigma" = ["rules/*.yml", "rules/*.yaml", "rules/README.md"]
"aegis.api" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.setuptools.dynamic]
version = { attr = "aegis.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reference_scaffold"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-hids"
dynamic = ["version"]
description = "Aegis — Host security monitoring, detection & response for Windows endpoints"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aegis" }]
keywords = ["security", "host-ids", "firewall", "detection-engineering", "mitre-attack", "blue-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "flet==0.86.*",
    "psutil>=7.0,<8",
    "win11toast>=0.35; sys_platform == 'win32'",
    "scikit-learn>=1.5,<2",
    "numpy>=2.0,<3",
    "joblib>=1.3",
]

[project.urls]
Homepage = "https://github.com/your-username/aegis"
Repository = "https://github.com/your-username/aegis"
Issues = "https://github.com/your-username/aegis/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
aegis = "aegis.__main__:main"

[tool.setuptools.packages.find]
include = ["aegis*"]
exclude = ["reference_scaffold*", "tests*"]

[tool.setuptools.dynamic]
version = { attr = "aegis.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reference_scaffold"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

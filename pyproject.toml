[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-hids"
dynamic = ["version"]
description = "Aegis — Cross-platform host security monitoring, detection & response"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Om Jangam" }]
keywords = ["security", "host-ids", "hids", "firewall", "detection-engineering", "mitre-attack", "blue-team", "nftables", "pf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
# The base install is headless so it can go on a server without dragging in a
# GUI toolkit. The desktop console is the `ui` extra.
dependencies = [
    "psutil>=7.0,<8",
    "win11toast>=0.35; sys_platform == 'win32'",
    "scikit-learn>=1.5,<2",
    "numpy>=2.0,<3",
    "joblib>=1.3",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/omjangam/aegis"
Repository = "https://github.com/omjangam/aegis"
Issues = "https://github.com/omjangam/aegis/issues"

[project.optional-dependencies]
ui = ["flet==0.86.*"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "flet==0.86.*",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
include = ["aegis*"]
exclude = ["reference_scaffold*", "tests*"]

[tool.setuptools.package-data]
# The bundled Sigma rules are data, not code, so they must be declared to reach
# the wheel — otherwise an installed Aegis would load zero rules.
"aegis.detection.sigma" = ["rules/*.yml", "rules/*.yaml", "rules/README.md"]
"aegis.api" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.setuptools.dynamic]
version = { attr = "aegis.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reference_scaffold"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

title: Credential Dumping Utility Execution
id: aegis-0007-credential-dumping
status: stable
description: >
    Execution of a known credential-theft tool, or of a signed utility being used
    to dump LSASS memory. Stolen credentials are what turns a single compromised
    host into a compromised network.
author: Aegis
references:
    - https://attack.mitre.org/techniques/T1003/
logsource:
    category: process_creation
detection:
    selection_tool_name:
        Image|endswith:
            - '\mimikatz.exe'
            - '\procdump.exe'
            - '\procdump64.exe'
            - '\pwdump.exe'
            - '\gsecdump.exe'
            - '/mimipenguin'
    selection_lsass_dump:
        CommandLine|contains:
            - 'lsass'
            - 'sekurlsa'
            - 'logonpasswords'
    selection_comsvcs:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains:
            - 'comsvcs.dll'
            - 'MiniDump'
    selection_shadow_creds:
        CommandLine|contains:
            - '/etc/shadow'
            - 'unshadow '
    condition: selection_tool_name or selection_comsvcs or selection_shadow_creds or (selection_lsass_dump and not selection_tool_name)
falsepositives:
    - Crash-dump collection by legitimate diagnostics tooling
level: critical
tags:
    - attack.credential-access
    - attack.t1003
    - attack.t1003.001

title: Office Application Spawning a Script Interpreter
id: aegis-0005-office-spawns-interpreter
status: stable
description: >
    A document application launching a shell or scripting engine. Word and Excel
    have no legitimate reason to start PowerShell; this is the classic signature
    of a malicious macro executing its payload.
author: Aegis
references:
    - https://attack.mitre.org/techniques/T1566/001/
    - https://attack.mitre.org/techniques/T1059/
logsource:
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith:
            - 'winword.exe'
            - 'excel.exe'
            - 'powerpnt.exe'
            - 'outlook.exe'
            - 'msaccess.exe'
            - 'visio.exe'
            - 'wordpad.exe'
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'
            - '\schtasks.exe'
    condition: selection_parent and selection_child
falsepositives:
    - Enterprise document templates that legitimately shell out on open
level: critical
tags:
    - attack.initial-access
    - attack.t1566.001
    - attack.execution
    - attack.t1059

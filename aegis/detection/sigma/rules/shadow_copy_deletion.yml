title: Volume Shadow Copy Deletion
id: aegis-0003-shadow-copy-deletion
status: stable
description: >
    Deletion of Windows volume shadow copies, which destroys the snapshots a
    victim would otherwise restore from. Almost every ransomware family does
    this immediately before or after encryption.
author: Aegis
references:
    - https://attack.mitre.org/techniques/T1490/
logsource:
    category: process_creation
detection:
    selection_vssadmin:
        Image|endswith:
            - '\vssadmin.exe'
            - '\diskshadow.exe'
        CommandLine|contains:
            - 'delete shadows'
            - 'delete shadowstorage'
    selection_wmic:
        Image|endswith: '\wmic.exe'
        CommandLine|contains: 'shadowcopy delete'
    selection_bcdedit:
        Image|endswith: '\bcdedit.exe'
        CommandLine|contains:
            - 'recoveryenabled no'
            - 'ignoreallfailures'
    condition: 1 of selection_*
falsepositives:
    - Backup software pruning its own snapshots on a maintenance schedule
level: critical
tags:
    - attack.impact
    - attack.t1490
